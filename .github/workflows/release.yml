name: Release

# Push a tag like v0.1.0 to build installers for every OS and publish a GitHub Release.
# Tags with a suffix (v0.2.0-rc1) become pre-releases. Run manually for a dry run (artifacts only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: windows
          - os: macos-latest      # Apple Silicon
            kind: macos
            arch: arm64
          - os: macos-15-intel
            kind: macos
            arch: x86_64
          - os: ubuntu-22.04      # older glibc so the AppImage runs on more distros
            kind: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out version
        id: version
        run: |
          PROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [[ "${TAG%%-*}" != "$PROJECT" ]]; then
              echo "::error::Tag v$TAG does not match pyproject.toml version $PROJECT"; exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=$PROJECT-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Qt runtime libraries
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libgl1 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/imagesizer.spec

      - name: Package (Windows installer)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\imagesizer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (macOS disk image)
        if: matrix.kind == 'macos'
        run: packaging/macos/make_dmg.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}" dist/ImageSizer.app dist

      - name: Package (Linux AppImage)
        if: matrix.kind == 'linux'
        run: packaging/linux/make_appimage.sh "${{ steps.version.outputs.version }}" dist/ImageSizer dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.kind }}-${{ matrix.arch || 'x64' }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Which file do I download?

            | Your computer | File |
            |---|---|
            | Windows 10/11 | `ImageSizer-…-Windows-Setup.exe` |
            | Mac with Apple Silicon (M1/M2/M3/M4…) | `ImageSizer-…-macOS-arm64.dmg` |
            | Mac with Intel processor | `ImageSizer-…-macOS-x86_64.dmg` |
            | Linux (64-bit) | `ImageSizer-…-x86_64.AppImage` |

            Not sure which Mac you have?  → **About This Mac** shows *Chip: Apple…* (Apple Silicon) or *Processor: Intel…*.
            The apps aren't code-signed yet, so Windows and macOS show a warning the first time. See the [install guide](https://github.com/hembone/imagesizer#download) for the one-click workaround.
