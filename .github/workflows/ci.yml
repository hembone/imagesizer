name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build app
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/imagesizer.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ImageSizer-${{ runner.os }}
          path: dist/
